function layout(){
  const n = order.length;
  const marginX = Math.max(90, W*0.11);
  const usableW = W - marginX*2;
  order.forEach((rid,i)=>{
    const t = n===1?0.5:i/(n-1);
    const x = marginX + usableW*t;
    const y = H*0.5 + Math.sin(t*Math.PI*1.6 - 0.4)*H*0.07;
    hubPos[rid] = {x,y,baseX:x,baseY:y,phase:i*1.27};
  });
  order.forEach((rid,k)=>{
    const hub = hubPos[rid];
    const items = nodes.filter(n=>n.region===rid && n.type==='item');
    const m = items.length;
    const baseR = 58 + Math.min(m,14)*5.5;
    // alternate cluster to upper/lower hemisphere to reduce overlap
    const dir = (k%2===0)? -1 : 1;
    items.forEach((it,idx)=>{
      const a = (m===1? -Math.PI/2 : (-Math.PI*0.92/2) + (idx/(Math.max(1,m-1)))*Math.PI*0.92);
      const rx = baseR*0.62, ry = baseR;
      it.tx = hub.x + Math.cos(a)*rx;
      it.ty = hub.y + Math.sin(a)*ry*dir*0.9 + dir*10;
      it.phase = idx*0.9 + k*1.7;
    });
  });
  layoutDone = true;
}

// node runtime state
nodes.forEach(n=>{ n.x=n.tx||0; n.y=n.ty||0; n.hover=false; n.focus=false; });

// ---- interaction state ----
let mouse={x:-1,y:-1,down:false,lx:0,ly:0,moved:false};
let selected=null;
let searchSet=null; // Set of ids matching
let time=0;

function worldToScreen(x,y){ return {x:(x+view.x)*view.scale, y:(y+view.y)*view.scale}; }
function screenToWorld(x,y){ return {x:x/view.scale - view.x, y:y/view.scale - view.y}; }

function getNodeAt(sx,sy){
  // check items + hubs (reverse so topmost first)
  for(let i=nodes.length-1;i>=0;i--){
    const n=nodes[i];
    const p=worldToScreen(n.x,n.y);
    const r=(n.type==='hub'?22:9)/1 + 4;
    const rr=r*view.scale;
    const dx=sx-p.x, dy=sy-p.y;
    if(dx*dx+dy*dy <= rr*rr) return n;
  }
  return null;
}

// ---- helpers ----
function lerp(a,b,t){return a+(b-a)*t;}
function bezier(p0,p1,p2,t){const u=1-t;return{x:u*u*p0.x+2*u*t*p1.x+t*t*p2.y, y:u*u*p0.y+2*u*t*p1.y+t*t*p2.y};}
function edgeControl(p1,p2,bow){const mx=(p1.x+p2.x)/2,my=(p1.y+p2.y)/2;const dx=p2.x-p1.x,dy=p2.y-p1.y;const nx=-dy,ny=dx;const len=Math.hypot(nx,ny)||1;return{x:mx+nx/len*bow,y:my+ny/len*bow};}

function nodeVisible(n){
  if(!searchSet) return true;
  return searchSet.has(n.id);
}

// ---- drawing ----
function draw(){
  ctx.clearRect(0,0,W,H);
  // background vignette
  const g=ctx.createRadialGradient(W*0.6,H*0.35,80,W*0.5,H*0.5,Math.max(W,H)*0.75);
  g.addColorStop(0,'rgba(20,40,80,0.20)');g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  const showAll = !searchSet;

  // 1) sim edges (interconnections) - subtle
  edges.filter(e=>e.kind==='sim').forEach(e=>{
    const a=byId[e.from], b=byId[e.to];
    const pa=worldToScreen(a.x,a.y), pb=worldToScreen(b.x,b.y);
    const c=edgeControl(pa,pb,18*view.scale);
    let alpha = 0.10 + e.w*0.34;
    const involved = selected && (selected.id===e.from||selected.id===e.to);
    const inSearch = showAll || (searchSet.has(e.from)&&searchSet.has(e.to));
    if(selected){ alpha = involved?0.55:0.04; }
    if(!inSearch) alpha*=0.25;
    alpha=Math.min(alpha,0.6);
    ctx.beginPath();ctx.moveTo(pa.x,pa.y);ctx.quadraticCurveTo(c.x,c.y,pb.x,pb.y);
    ctx.strokeStyle=`rgba(130,170,255,${alpha})`;
    ctx.lineWidth=(0.6+e.w*1.6)*view.scale*0.7;
    ctx.stroke();
  });

  // 2) trunk edges (hub->hub) glowing + particles
  const trunk=edges.filter(e=>e.kind==='trunk');
  trunk.forEach(e=>{
    const a=byId[e.from], b=byId[e.to];
    const pa=worldToScreen(a.x,a.y), pb=worldToScreen(b.x,b.y);
    const c=edgeControl(pa,pb,40*view.scale);
    ctx.beginPath();ctx.moveTo(pa.x,pa.y);ctx.quadraticCurveTo(c.x,c.y,pb.x,pb.y);
    ctx.strokeStyle='rgba(126,232,255,0.28)';ctx.lineWidth=2.2*view.scale;ctx.stroke();
    // particles
    const speed=0.00018;
    for(let k=0;k<3;k++){
      let t=((time*speed)+k/3)%1;
      const p=bezier(pa,c,pb,t);
      const gr=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,7*view.scale);
      gr.addColorStop(0,'rgba(180,250,255,0.95)');gr.addColorStop(1,'rgba(126,232,255,0)');
      ctx.fillStyle=gr;ctx.beginPath();ctx.arc(p.x,p.y,7*view.scale,0,7);ctx.fill();
    }
  });

  // 3) hub->item edges + light particles
  edges.filter(e=>e.kind==='hub').forEach(e=>{
    const a=byId[e.from], b=byId[e.to];
    const pa=worldToScreen(a.x,a.y), pb=worldToScreen(b.x,b.y);
    const c=edgeControl(pa,pb,14*view.scale);
    let alpha=0.18;
    if(selected){ alpha = (selected.id===e.from||selected.id===e.to)?0.5:0.05; }
    if(!showAll){ alpha = (searchSet.has(e.to)||searchSet.has(e.from))?0.5:0.04; }
    ctx.beginPath();ctx.moveTo(pa.x,pa.y);ctx.quadraticCurveTo(c.x,c.y,pb.x,pb.y);
    ctx.strokeStyle=`rgba(150,190,255,${alpha})`;ctx.lineWidth=1*view.scale;ctx.stroke();
    if(selected && (selected.id===e.from)){
      const t=((time*0.0004)%1);
      const p=bezier(pa,c,pb,t);
      ctx.fillStyle='rgba(180,230,255,0.9)';ctx.beginPath();ctx.arc(p.x,p.y,3.2*view.scale,0,7);ctx.fill();
    }
  });

  // 4) nodes
  nodes.forEach(n=>{
    const p=worldToScreen(n.x,n.y);
    const isHub=n.type==='hub';
    const baseR=isHub?20:7.5;
    const focus = selected && selected.id===n.id;
    const hot = n.hover;
    const dim = !showAll && !searchSet.has(n.id);
    let r=baseR;
    if(hot) r=baseR*1.25;
    if(focus) r=baseR*1.4;
    const col=n.color||'#7ee8ff';
    if(isHub){
      // pulsing ring
      const pulse=1+Math.sin(time*0.002 + n.phase||0)*0.12;
      ctx.beginPath();ctx.arc(p.x,p.y,r*pulse+6,0,7);
      ctx.strokeStyle=hexA(col,0.35);ctx.lineWidth=1.5*view.scale;ctx.stroke();
      ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);
      const gr=ctx.createRadialGradient(p.x,p.y,1,p.x,p.y,r);
      gr.addColorStop(0,hexA(col,0.95));gr.addColorStop(1,hexA(col,0.55));
      ctx.fillStyle=gr;ctx.fill();
      ctx.shadowColor=col;ctx.shadowBlur=18*view.scale;
      ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.fillStyle=col;ctx.globalAlpha=dim?0.3:1;ctx.fill();ctx.globalAlpha=1;ctx.shadowBlur=0;
      // label
      if(!dim){
        ctx.fillStyle='rgba(232,240,255,0.95)';ctx.font=`600 ${12*view.scale}px -apple-system,Segoe UI,sans-serif`;
        ctx.textAlign='center';ctx.textBaseline='top';
        ctx.fillText(regions[n.region].name.split(' (')[0], p.x, p.y+r+9);
      }
    } else {
      ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);
      ctx.fillStyle=col;ctx.globalAlpha=dim?0.18:1;
      if(hot||focus){ctx.shadowColor=col;ctx.shadowBlur=14*view.scale;}
      ctx.fill();ctx.shadowBlur=0;ctx.globalAlpha=1;
      if(focus){ctx.beginPath();ctx.arc(p.x,p.y,r+4,0,7);ctx.strokeStyle=hexA(col,0.8);ctx.lineWidth=1.5;ctx.stroke();}
    }
  });

  // hover tooltip
  const hn = mouse.hoverNode;
  if(hn && !selected){
    const p=worldToScreen(hn.x,hn.y);
    const txt=hn.title;
    ctx.font='600 12px -apple-system,Segoe UI,sans-serif';ctx.textAlign='left';ctx.textBaseline='middle';
    const tw=ctx.measureText(txt).width;
    const bx=p.x+ (hn.type==='hub'?24:13), by=p.y-9;
    ctx.fillStyle='rgba(8,14,30,0.92)';roundRect(bx,by,tw+18,22,7);ctx.fill();
    ctx.strokeStyle=hexA(hn.color||'#7ee8ff',0.5);ctx.lineWidth=1;roundRect(bx,by,tw+18,22,7);ctx.stroke();
    ctx.fillStyle='#e8f0ff';ctx.fillText(txt,bx+9,by+11);
  }
}

function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function hexA(hex,a){const h=hex.replace('#','');const r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);return `rgba(${r},${g},${b},${a})`;}

// ---- animation ----
let last=performance.now();
function loop(now){
  const dt=now-last;last=now;time=now;
  // float nodes slightly + animate layout toward target (eased)
  nodes.forEach(n=>{
    const tx=n.tx||n.x, ty=n.ty||n.y;
    const fx=Math.sin(time*0.0006 + (n.phase||0))*3;
    const fy=Math.cos(time*0.0005 + (n.phase||0))*3;
    n.x += ((tx+fx)-n.x)*0.06;
    n.y += ((ty+fy)-n.y)*0.06;
  });
  // hubs extra float
  order.forEach(rid=>{const h=hubPos[rid];h.x+=(h.baseX-h.x)*0.05;h.y+=(h.baseY-h.y)*0.05;});
  // view easing
  view.x += (view.tx-view.x)*0.12;
  view.y += (view.ty-view.y)*0.12;
  view.scale += (view.tscale-view.scale)*0.12;
  draw();
  requestAnimationFrame(loop);
}

// ---- events ----
canvas.addEventListener('mousemove',e=>{
  const r=canvas.getBoundingClientRect();
  mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;
  if(mouse.down){
    const dx=mouse.x-mouse.lx, dy=mouse.y-mouse.ly;
    if(Math.abs(dx)+Math.abs(dy)>3) mouse.moved=true;
    view.tx += dx/view.scale; view.ty += dy/view.scale;
    mouse.lx=mouse.x;mouse.ly=mouse.y;
  } else {
    const n=getNodeAt(mouse.x,mouse.y);
    mouse.hoverNode=n;
    nodes.forEach(nn=>nn.hover=false);
    if(n) n.hover=true;
    canvas.style.cursor = n?'pointer':'grab';
  }
});
canvas.addEventListener('mousedown',e=>{mouse.down=true;mouse.moved=false;const r=canvas.getBoundingClientRect();mouse.lx=e.clientX-r.left;mouse.ly=e.clientY-r.top;});
window.addEventListener('mouseup',e=>{
  if(mouse.down && !mouse.moved){
    const r=canvas.getBoundingClientRect();
    const n=getNodeAt(mouse.x,mouse.y);
    if(n) selectNode(n);
    else closePanel();
  }
  mouse.down=false;
});
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=canvas.getBoundingClientRect();
  const mx=e.clientX-r.left,my=e.clientY-r.top;
  const before=screenToWorld(mx,my);
  const factor=e.deltaY<0?1.12:0.89;
  view.tscale=Math.max(0.4,Math.min(2.6,view.tscale*factor));
  // keep cursor anchored
  const after=screenToWorld(mx,my);
  view.tx += after.x-before.x; view.ty += after.y-before.y;
},{passive:false});

// touch
canvas.addEventListener('touchstart',e=>{const t=e.touches[0];const r=canvas.getBoundingClientRect();mouse.x=t.clientX-r.left;mouse.y=t.clientY-r.top;mouse.down=true;mouse.moved=false;mouse.lx=mouse.x;mouse.ly=mouse.y;},{passive:true});
canvas.addEventListener('touchmove',e=>{const t=e.touches[0];const r=canvas.getBoundingClientRect();const nx=t.clientX-r.left,ny=t.clientY-r.top;const dx=nx-mouse.lx,dy=ny-mouse.ly;if(Math.abs(dx)+Math.abs(dy)>3)mouse.moved=true;view.tx+=dx/view.scale;view.ty+=dy/view.scale;mouse.lx=nx;mouse.ly=ny;mouse.x=nx;mouse.y=ny;},{passive:true});
canvas.addEventListener('touchend',e=>{if(mouse.down&&!mouse.moved){const n=getNodeAt(mouse.x,mouse.y);if(n)selectNode(n);else closePanel();}mouse.down=false;},{passive:true});

// ---- panel ----
const panel=document.getElementById('panel');
function selectNode(n){
  selected=n;
  document.getElementById('ptagDot').style.color=n.color;
  document.getElementById('ptagDot').style.background=n.color;
  document.getElementById('ptagTxt').textContent = n.type==='hub' ? regions[n.region].role : (regions[n.region].name.split(' (')[0]);
  document.getElementById('ptitle').textContent = n.title;
  document.getElementById('pdetail').textContent = n.detail;
  document.getElementById('psrc').textContent = '来源：' + (n.source||'—');
  // related chips
  const chips=document.getElementById('pchips');chips.innerHTML='';
  const rel=simAdj[n.id]||[];
  if(rel.length===0){
    document.getElementById('prel').style.display='none';
  } else {
    document.getElementById('prel').style.display='block';
    rel.slice(0,8).forEach(r=>{
      const t=document.createElement('div');t.className='chip';t.textContent=byId[r.to].title;
      t.onclick=()=>{ selectNode(byId[r.to]); };
      chips.appendChild(t);
    });
  }
  panel.classList.add('open');
}
function closePanel(){selected=null;panel.classList.remove('open');}
document.getElementById('pclose').onclick=closePanel;

// ---- legend ----
(function(){
  const lg=document.getElementById('legend');
  let html='<div class="lg-title">海马体神经环路 · 记忆分区</div>';
  order.forEach(rid=>{
    const r=regions[rid];
    html+=`<div class="row"><span class="dot" style="background:${r.color};color:${r.color}"></span><div><div>${r.name.split(' (')[0]}</div><div class="role">${r.role}</div></div></div>`;
  });
  lg.innerHTML=html;
})();

// ---- search ----
const q=document.getElementById('q');
const cnt=document.getElementById('cnt');
q.addEventListener('input',()=>{
  const v=q.value.trim().toLowerCase();
  if(!v){searchSet=null;cnt.style.display='none';return;}
  const set=new Set();
  nodes.forEach(n=>{
    if((n.title||'').toLowerCase().includes(v)||(n.detail||'').toLowerCase().includes(v)||(n.source||'').toLowerCase().includes(v)) set.add(n.id);
  });
  searchSet=set;
  cnt.style.display='inline-block';cnt.textContent=set.size;
  // also include hubs of matched items for context
  if(set.size>0){ order.forEach(rid=>{ if(nodes.some(n=>n.region===rid&&n.type==='item'&&set.has(n.id))) set.add('hub_'+rid); }); }
});

// ---- toast ----
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}

// ---- init ----
window.addEventListener('resize',resize);
resize();
requestAnimationFrame(loop);
toast('点击节点查看记忆 · 已连接 '+nodes.length+' 个记忆节点');
</script>
</body>
